name: optinfo
description: Private optics, semiconductor and world briefing reader.
publish_to: none
version: 0.1.3+4
environment:
  sdk: '>=3.6.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  http: ^1.4.0
  crypto: ^3.0.7
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  url_launcher: ^6.3.1
  cupertino_icons: ^1.0.8
  package_info_plus: ^9.0.1
  flutter_math_fork: 0.7.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - OFL-NotoSansSC.txt
  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-Variable.ttf
