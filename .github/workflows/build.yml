name: Build and test Optinfo
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest backend/tests -q
  client:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: runner.os == 'Linux'
        with:
          distribution: temurin
          java-version: '17'
      - name: Checkout pinned Flutter SDK
        uses: actions/checkout@v4
        with:
          repository: flutter/flutter
          ref: abaf9c523780a608bd46686fd5e53740a07077f8
          path: .flutter
      - name: Add Flutter to PATH
        shell: pwsh
        run: |
          git -C "$env:GITHUB_WORKSPACE/.flutter" fetch origin tag 3.47.7 --depth 1
          Add-Content -LiteralPath $env:GITHUB_PATH -Value "$env:GITHUB_WORKSPACE/.flutter/bin"
      - uses: actions/cache@v4
        with:
          path: .flutter/bin/cache
          key: flutter-3.47.7-${{ runner.os }}
      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Restore private Android signing key
        if: runner.os == 'Linux'
        shell: bash
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE"
          printf '%s' "$KEYSTORE" | base64 --decode > android/app/release.p12
          printf 'storeFile=release.p12\nstoreType=PKCS12\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=optinfo\n' "$STORE_PASSWORD" "$STORE_PASSWORD" > android/key.properties
      - name: Build Android
        if: runner.os == 'Linux'
        run: flutter build apk --release
      - name: Verify Android release signature
        if: runner.os == 'Linux'
        shell: bash
        run: |
          APK_SIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APK_SIGNER"
          "$APK_SIGNER" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk
      - name: Build Windows
        if: runner.os == 'Windows'
        run: flutter build windows --release
      - name: Zip Windows program
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath Optinfo-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: Optinfo-Windows-x64
          path: client/Optinfo-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: Optinfo-Android
          path: client/build/app/outputs/flutter-apk/app-release.apk
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [backend, client]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Optinfo-Android
          path: incoming/android
      - uses: actions/download-artifact@v4
        with:
          name: Optinfo-Windows-x64
          path: incoming/windows
      - name: Prepare versioned release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, shutil, subprocess
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          assert re.fullmatch(r'v\d+\.\d+\.\d+(?:-[A-Za-z0-9.-]+)?', tag), 'Invalid release tag'
          match = re.search(r'^version:\s*(\S+)', Path('client/pubspec.yaml').read_text(), re.M)
          assert match and match.group(1).split('+')[0] == tag[1:], 'Tag must match client version'
          notes = Path('docs/releases') / (tag + '.md')
          assert notes.is_file(), 'Versioned release notes are required'
          out = Path('release-assets')
          out.mkdir(exist_ok=True)
          files = []
          for source, name in [
              ('incoming/android/app-release.apk', f'Optinfo-Android-{tag}.apk'),
              ('incoming/windows/Optinfo-Windows-x64.zip', f'Optinfo-Windows-x64-{tag}.zip'),
          ]:
              target = out / name
              shutil.copyfile(source, target)
              files.append(target)
          (out / 'SHA256SUMS.txt').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name + '\n' for p in files))
          (out / 'BUILD_INFO.json').write_text(json.dumps({
              'version': match.group(1),
              'source_commit': os.environ['GITHUB_SHA'],
              'client_tree': subprocess.check_output(['git', 'rev-parse', 'HEAD:client'], text=True).strip(),
              'build_run': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              'flutter_version': '3.47.7',
              'android_signature_verified': True,
          }, indent=2) + '\n')
          PY
      - name: Publish complete GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          notes="docs/releases/${RELEASE_TAG}.md"
          if gh release view "$RELEASE_TAG" --json isDraft > existing-release.json 2>/dev/null; then
            if [ "$(python3 -c "import json; print(json.load(open('existing-release.json'))['isDraft'])")" != "True" ]; then
              echo "Release is already published; leaving published assets unchanged."
              exit 0
            fi
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* --verify-tag --draft --title "Optinfo ${RELEASE_TAG}" --notes-file "$notes"
          fi
          gh release edit "$RELEASE_TAG" --draft=false --latest --title "Optinfo ${RELEASE_TAG}" --notes-file "$notes"
